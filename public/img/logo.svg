<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5" />
            <stop offset="100%" stop-color="#8B5CF6" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
            <feOffset dx="0" dy="2" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    
    {{-- Fond Squircle --}}
    <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#logoGradient)" />
    
    {{-- Formes de connexion (Matching) --}}
    <path d="M40 35C40 35 30 45 30 55C30 65 40 70 50 70C60 70 70 65 70 55C70 45 60 35 60 35" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.3" />
    
    {{-- L'étincelle centrale (IA) --}}
    <path d="M50 30L53 43L66 46L53 49L50 62L47 49L34 46L47 43L50 30Z" fill="white" filter="url(#shadow)" />
    
    {{-- Petites particules --}}
    <circle cx="72" cy="35" r="3" fill="white" opacity="0.6" />
    <circle cx="28" cy="65" r="2" fill="white" opacity="0.4" />
</svg>
