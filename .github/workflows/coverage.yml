---
name: Test Coverage

"on":
  push:
    branches:
      - master
  pull_request:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: >
          composer install -q --no-ansi --no-interaction --no-scripts
          --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Execute frontend tests with coverage
        run: npm run test:js -- --coverage

      - name: Upload frontend coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage-summary
          path: coverage/coverage-summary.json

      - name: Execute tests with coverage
        if: always()
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan test --coverage --coverage-clover=coverage.xml --coverage-html=coverage-report

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage-report
          path: coverage-report/

      - name: Comment Coverage on PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const script = require('./.github/scripts/comment-coverage.cjs');
            await script({ github, context });
