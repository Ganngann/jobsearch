---
name: Test Coverage

"on":
  push:
  pull_request:
    branches: ["master"]

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: >
          composer install -q --no-ansi --no-interaction --no-scripts
          --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Execute tests with coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: |
          php artisan test --coverage --coverage-clover=coverage.xml --coverage-html=coverage-report

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage-report
          path: coverage-report/

      - name: Post Coverage Summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            PERCENTAGE=$(php -r '$xml = simplexml_load_file("coverage.xml"); $metrics = $xml->project->metrics; $covered = (float)$metrics["coveredstatements"]; $total = (float)$metrics["statements"]; echo $total > 0 ? round(($covered / $total) * 100, 2) : 0;')
            echo "### 📊 Code Coverage: ${PERCENTAGE}%" >> $GITHUB_STEP_SUMMARY
          fi
